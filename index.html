<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>時鐘練習單產生器｜認知訓練工具</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg-page: #f5f4ef;
    --bg-card: #ffffff;
    --bg-secondary: #f1efe8;
    --text-primary: #2c2c2a;
    --text-secondary: #5f5e5a;
    --text-tertiary: #888780;
    --text-info: #185fa5;
    --border-tertiary: rgba(0, 0, 0, 0.12);
    --border-secondary: rgba(0, 0, 0, 0.25);
    --radius-md: 8px;
    --radius-lg: 12px;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
  }
  body {
    font-family: var(--font-sans);
    background: var(--bg-page);
    color: var(--text-primary);
    line-height: 1.6;
    padding: 1.5rem;
    min-height: 100vh;
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
  }
  .page-header {
    margin-bottom: 1.5rem;
    text-align: center;
  }
  .page-header h1 {
    font-size: 22px;
    font-weight: 500;
    margin-bottom: 4px;
  }
  .page-header p {
    font-size: 14px;
    color: var(--text-secondary);
  }
  .controls {
    background: var(--bg-secondary);
    border-radius: var(--radius-lg);
    padding: 1.25rem;
    margin-bottom: 1.5rem;
  }
  .controls-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1rem;
  }
  .control-group label {
    display: block;
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .control-group.full-width {
    grid-column: 1 / -1;
  }
  select, button, input[type="text"] {
    width: 100%;
    height: 36px;
    padding: 0 12px;
    font-family: inherit;
    font-size: 14px;
    color: var(--text-primary);
    background: var(--bg-card);
    border: 0.5px solid var(--border-secondary);
    border-radius: var(--radius-md);
    transition: all 0.15s;
  }
  select, button {
    cursor: pointer;
  }
  select:hover, button:hover, input[type="text"]:hover {
    border-color: var(--text-primary);
  }
  input[type="text"]:focus {
    outline: none;
    border-color: var(--text-primary);
    box-shadow: 0 0 0 2px rgba(44, 44, 42, 0.1);
  }
  button {
    background: transparent;
    font-weight: 500;
  }
  button:hover {
    background: var(--bg-card);
  }
  button:active {
    transform: scale(0.98);
  }
  button.primary {
    background: var(--text-primary);
    color: var(--bg-card);
    border-color: var(--text-primary);
  }
  button.primary:hover {
    background: #000;
  }
  .button-row {
    display: flex;
    gap: 8px;
    margin-top: 1rem;
    flex-wrap: wrap;
  }
  .button-row button {
    flex: 1;
    min-width: 120px;
  }
  .preview-label {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* 頁尾設計者資訊 */
  .site-footer {
    margin-top: 2rem;
    padding-top: 1.25rem;
    border-top: 0.5px solid var(--border-tertiary);
    text-align: center;
    font-size: 13px;
    color: var(--text-secondary);
  }
  .site-footer b {
    color: var(--text-primary);
    font-weight: 500;
  }

  .worksheet-wrapper {
    display: flex;
    justify-content: center;
    width: 100%;
    overflow: hidden;
  }
  .worksheet-scaler {
    transform-origin: top center;
  }

  .worksheet {
    width: 210mm;
    height: 297mm;
    background: #ffffff;
    color: #2c2c2a;
    padding: 14mm 14mm;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    border-radius: 4px;
    font-family: var(--font-sans);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .worksheet-header {
    border-bottom: 1px solid #d0d0c8;
    padding-bottom: 5mm;
    margin-bottom: 5mm;
    flex-shrink: 0;
  }
  .worksheet-header h2 {
    font-size: 18pt;
    font-weight: 500;
    margin-bottom: 4mm;
    word-break: break-word;
  }
  .info-fields {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 6mm;
    align-items: end;
  }
  .field-item {
    display: flex;
    align-items: end;
    gap: 2mm;
    font-size: 11pt;
    color: #2c2c2a;
  }
  .field-label {
    flex-shrink: 0;
    font-weight: 500;
  }
  .field-blank {
    flex: 1;
    border-bottom: 1px solid #888780;
    height: 8mm;
  }
  .questions-grid {
    display: grid;
    gap: 4mm;
    flex: 1;
    min-height: 0;
  }
  .questions-grid.cols-2 {
    grid-template-columns: repeat(2, 1fr);
  }
  .questions-grid.cols-3 {
    grid-template-columns: repeat(3, 1fr);
  }
  .questions-grid.rows-3 {
    grid-template-rows: repeat(3, 1fr);
  }
  .questions-grid.rows-4 {
    grid-template-rows: repeat(4, 1fr);
  }
  .question-card {
    border: 0.5px solid #b8b8b0;
    border-radius: 4px;
    padding: 3mm;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    overflow: hidden;
  }
  .question-num {
    font-size: 9pt;
    color: #5f5e5a;
    text-align: left;
    align-self: flex-start;
    margin-bottom: 1mm;
  }
  .question-prompt {
    font-size: 10pt;
    font-weight: 500;
    margin-bottom: 2mm;
  }
  .clock-wrapper {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
  }
  .clock-svg {
    display: block;
  }
  .answer-line {
    border-top: 0.5px solid #d0d0c8;
    margin-top: 2mm;
    padding-top: 2mm;
    font-size: 9pt;
    color: #5f5e5a;
    width: 100%;
  }
  .answer-line.show-answer {
    color: #185fa5;
    font-weight: 500;
  }
  .answer-blank-small {
    display: inline-block;
    border-bottom: 0.5px solid #888780;
    min-width: 18mm;
    margin-left: 2mm;
    height: 12px;
  }
  .worksheet-footer {
    margin-top: 3mm;
    padding-top: 2mm;
    border-top: 0.5px solid #d0d0c8;
    font-size: 8pt;
    color: #888780;
    text-align: center;
    flex-shrink: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* 隱藏式渲染區，用於批次產生多份 PDF */
  .render-zone {
    position: absolute;
    left: -99999px;
    top: 0;
    pointer-events: none;
  }

  .loading {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 16px;
  }
  .loading.show {
    display: flex;
  }
  .spinner {
    width: 24px;
    height: 24px;
    border: 3px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 12px;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @media (max-width: 768px) {
    body { padding: 0.75rem; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="page-header">
    <h1>時鐘練習單產生器</h1>
    <p>認知訓練工具｜可調整難度與題型，匯出 A4 PDF</p>
  </div>

  <div class="controls">
    <div class="controls-grid">
      <div class="control-group full-width">
        <label>練習單標題</label>
        <input type="text" id="custom-title" value="時鐘練習單" maxlength="30" placeholder="輸入練習單標題">
      </div>

      <div class="control-group">
        <label>練習類型</label>
        <select id="exercise-type">
          <option value="mixed">混合練習</option>
          <option value="draw">時鐘繪製（給時間，畫指針）</option>
          <option value="read">時間判讀（給時鐘，寫時間）</option>
        </select>
      </div>

      <div class="control-group">
        <label>難度</label>
        <select id="difficulty">
          <option value="1">第 1 級｜整點</option>
          <option value="2">第 2 級｜整點＋半點</option>
          <option value="3" selected>第 3 級｜每 15 分</option>
          <option value="4">第 4 級｜每 5 分</option>
          <option value="5">第 5 級｜任意分鐘</option>
        </select>
      </div>

      <div class="control-group">
        <label>題數</label>
        <select id="question-count">
          <option value="6">6 題（視覺友善版）</option>
          <option value="8" selected>8 題</option>
          <option value="12">12 題</option>
        </select>
      </div>

      <div class="control-group">
        <label>時鐘樣式</label>
        <select id="clock-style">
          <option value="numbers" selected>含數字 1-12</option>
          <option value="ticks">僅刻度</option>
          <option value="minimal">極簡（4 點標示）</option>
        </select>
      </div>

      <div class="control-group">
        <label>產生份數</label>
        <select id="copy-count">
          <option value="1" selected>1 份</option>
          <option value="2">2 份</option>
          <option value="3">3 份</option>
          <option value="5">5 份</option>
          <option value="10">10 份</option>
          <option value="20">20 份</option>
        </select>
      </div>
    </div>

    <div class="button-row">
      <button id="generate-btn">產生新題目</button>
      <button id="toggle-answer-btn">顯示／隱藏答案</button>
      <button id="download-btn" class="primary">下載 PDF</button>
    </div>
  </div>

  <div class="preview-label">
    <span>預覽（A4 大小，與 PDF 內容一致）</span>
    <span id="answer-status">答案：隱藏</span>
  </div>

  <div class="worksheet-wrapper">
    <div class="worksheet-scaler" id="worksheet-scaler">
      <div id="worksheet" class="worksheet"></div>
    </div>
  </div>

  <div class="site-footer">
    設計者：<b>愛迪樂 鍾孟修 職能治療師</b>
  </div>
</div>

<!-- 隱藏的批次渲染區 -->
<div class="render-zone" id="render-zone"></div>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <span id="loading-text">正在產生 PDF...</span>
</div>

<script>
(function() {
  const worksheet = document.getElementById('worksheet');
  const scaler = document.getElementById('worksheet-scaler');
  const wrapper = document.querySelector('.worksheet-wrapper');
  const renderZone = document.getElementById('render-zone');
  const generateBtn = document.getElementById('generate-btn');
  const toggleBtn = document.getElementById('toggle-answer-btn');
  const downloadBtn = document.getElementById('download-btn');
  const answerStatus = document.getElementById('answer-status');
  const loading = document.getElementById('loading');
  const loadingText = document.getElementById('loading-text');
  const customTitleInput = document.getElementById('custom-title');

  let showAnswers = false;
  let currentQuestions = [];

  function updateScale() {
    const a4WidthPx = 210 * (96 / 25.4);
    const wrapperWidth = wrapper.clientWidth;
    if (wrapperWidth < a4WidthPx) {
      const scale = wrapperWidth / a4WidthPx;
      scaler.style.transform = 'scale(' + scale + ')';
      const a4HeightPx = 297 * (96 / 25.4);
      wrapper.style.height = (a4HeightPx * scale) + 'px';
    } else {
      scaler.style.transform = 'scale(1)';
      wrapper.style.height = 'auto';
    }
  }

  function generateTime(level) {
    const hour = Math.floor(Math.random() * 12) + 1;
    let minute;
    if (level == 1) {
      minute = 0;
    } else if (level == 2) {
      minute = [0, 30][Math.floor(Math.random() * 2)];
    } else if (level == 3) {
      minute = [0, 15, 30, 45][Math.floor(Math.random() * 4)];
    } else if (level == 4) {
      minute = Math.floor(Math.random() * 12) * 5;
    } else {
      minute = Math.floor(Math.random() * 60);
    }
    return { hour, minute };
  }

  function formatTime(t) {
    const mm = String(t.minute).padStart(2, '0');
    return t.hour + ':' + mm;
  }

  function buildClockSVG(time, withHands, style, size) {
    size = size || 110;
    const cx = 80, cy = 80, r = 70;
    let svg = '<svg class="clock-svg" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg" width="' + size + '" height="' + size + '">';
    svg += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="#2c2c2a" stroke-width="1.4"/>';
    svg += '<circle cx="' + cx + '" cy="' + cy + '" r="2.2" fill="#2c2c2a"/>';

    for (let i = 1; i <= 12; i++) {
      const angle = (i * 30 - 90) * Math.PI / 180;
      const isMajor = (i % 3 === 0);
      const tickOuter = r;
      const tickInner = isMajor ? r - 8 : r - 5;
      const x1 = cx + Math.cos(angle) * tickInner;
      const y1 = cy + Math.sin(angle) * tickInner;
      const x2 = cx + Math.cos(angle) * tickOuter;
      const y2 = cy + Math.sin(angle) * tickOuter;
      svg += '<line x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) + '" stroke="#2c2c2a" stroke-width="' + (isMajor ? 1.6 : 0.9) + '"/>';

      if (style === 'numbers') {
        const numR = r - 14;
        const nx = cx + Math.cos(angle) * numR;
        const ny = cy + Math.sin(angle) * numR;
        svg += '<text x="' + nx.toFixed(1) + '" y="' + (ny + 4).toFixed(1) + '" text-anchor="middle" font-size="13" font-family="Arial, sans-serif" fill="#2c2c2a">' + i + '</text>';
      } else if (style === 'minimal' && isMajor) {
        const numR = r - 14;
        const nx = cx + Math.cos(angle) * numR;
        const ny = cy + Math.sin(angle) * numR;
        svg += '<text x="' + nx.toFixed(1) + '" y="' + (ny + 4).toFixed(1) + '" text-anchor="middle" font-size="13" font-family="Arial, sans-serif" fill="#2c2c2a">' + i + '</text>';
      }
    }

    if (withHands) {
      const minuteAngle = (time.minute * 6 - 90) * Math.PI / 180;
      const hourAngle = ((time.hour % 12) * 30 + time.minute * 0.5 - 90) * Math.PI / 180;
      const hourLen = r * 0.55;
      const minuteLen = r * 0.78;
      const hx = cx + Math.cos(hourAngle) * hourLen;
      const hy = cy + Math.sin(hourAngle) * hourLen;
      const mx = cx + Math.cos(minuteAngle) * minuteLen;
      const my = cy + Math.sin(minuteAngle) * minuteLen;
      svg += '<line x1="' + cx + '" y1="' + cy + '" x2="' + hx.toFixed(1) + '" y2="' + hy.toFixed(1) + '" stroke="#2c2c2a" stroke-width="3.2" stroke-linecap="round"/>';
      svg += '<line x1="' + cx + '" y1="' + cy + '" x2="' + mx.toFixed(1) + '" y2="' + my.toFixed(1) + '" stroke="#2c2c2a" stroke-width="2" stroke-linecap="round"/>';
    }

    svg += '</svg>';
    return svg;
  }

  function generateQuestions() {
    const type = document.getElementById('exercise-type').value;
    const level = parseInt(document.getElementById('difficulty').value);
    const count = parseInt(document.getElementById('question-count').value);
    const style = document.getElementById('clock-style').value;

    const questions = [];
    for (let i = 0; i < count; i++) {
      const time = generateTime(level);
      let qType;
      if (type === 'mixed') {
        qType = Math.random() < 0.5 ? 'draw' : 'read';
      } else {
        qType = type;
      }
      questions.push({ time, type: qType, style });
    }
    return questions;
  }

  function getLayout(count) {
    if (count === 6) {
      return { cols: 2, rows: 3, clockSize: 200 };
    } else if (count === 8) {
      return { cols: 2, rows: 4, clockSize: 140 };
    } else {
      return { cols: 3, rows: 4, clockSize: 110 };
    }
  }

  // 產生練習單 HTML（可重用）
  function buildWorksheetHTML(questions, withAnswers, copyIndex, totalCopies) {
    const count = questions.length;
    const layout = getLayout(count);
    const title = customTitleInput.value.trim() || '時鐘練習單';

    let html = '';
    html += '<div class="worksheet-header">';
    html += '<h2>' + escapeHTML(title) + '</h2>';
    html += '<div class="info-fields">';
    html += '<div class="field-item"><span class="field-label">姓名：</span><span class="field-blank"></span></div>';
    html += '<div class="field-item"><span class="field-label">日期：</span><span class="field-blank"></span></div>';
    html += '<div class="field-item"><span class="field-label">完成時間：</span><span class="field-blank"></span></div>';
    html += '</div>';
    html += '</div>';

    html += '<div class="questions-grid cols-' + layout.cols + ' rows-' + layout.rows + '">';
    questions.forEach((q, idx) => {
      html += '<div class="question-card">';
      html += '<div class="question-num">第 ' + (idx + 1) + ' 題</div>';

      if (q.type === 'draw') {
        html += '<div class="question-prompt">請畫出 ' + formatTime(q.time) + '</div>';
        html += '<div class="clock-wrapper">';
        html += buildClockSVG(q.time, withAnswers, q.style, layout.clockSize);
        html += '</div>';
        html += '<div class="answer-line' + (withAnswers ? ' show-answer' : '') + '">';
        html += withAnswers ? '答案：已標示指針' : '請畫出時針與分針';
        html += '</div>';
      } else {
        html += '<div class="question-prompt">時間是幾點幾分？</div>';
        html += '<div class="clock-wrapper">';
        html += buildClockSVG(q.time, true, q.style, layout.clockSize);
        html += '</div>';
        html += '<div class="answer-line' + (withAnswers ? ' show-answer' : '') + '">';
        if (withAnswers) {
          html += '答案：' + formatTime(q.time);
        } else {
          html += '答：<span class="answer-blank-small"></span>';
        }
        html += '</div>';
      }
      html += '</div>';
    });
    html += '</div>';

    // 頁尾：左邊放份數編號，右邊放設計者
    html += '<div class="worksheet-footer">';
    if (totalCopies && totalCopies > 1) {
      html += '<span>第 ' + copyIndex + ' / ' + totalCopies + ' 份</span>';
    } else {
      html += '<span></span>';
    }
    html += '<span>設計者：愛迪樂 鍾孟修 職能治療師</span>';
    html += '</div>';

    return html;
  }

  function escapeHTML(s) {
    return String(s).replace(/[&<>"']/g, function(c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function renderWorksheet() {
    worksheet.innerHTML = buildWorksheetHTML(currentQuestions, showAnswers, 1, 1);
    answerStatus.textContent = '答案：' + (showAnswers ? '顯示中' : '隱藏');
    updateScale();
  }

  function regenerate() {
    showAnswers = false;
    currentQuestions = generateQuestions();
    renderWorksheet();
  }

  // 在隱藏區塊建立一個 worksheet DOM 並回傳
  function createOffscreenWorksheet(questions, withAnswers, copyIndex, totalCopies) {
    const div = document.createElement('div');
    div.className = 'worksheet';
    div.innerHTML = buildWorksheetHTML(questions, withAnswers, copyIndex, totalCopies);
    renderZone.appendChild(div);
    return div;
  }

  async function downloadPDF() {
    const copyCount = parseInt(document.getElementById('copy-count').value);
    loading.classList.add('show');

    try {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({
        orientation: 'portrait',
        unit: 'mm',
        format: 'a4',
        compress: true
      });

      // 清空渲染區
      renderZone.innerHTML = '';

      for (let i = 0; i < copyCount; i++) {
        loadingText.textContent = '正在產生 PDF... (' + (i + 1) + ' / ' + copyCount + ')';

        // 每一份產生新題目（同樣設定但不同題目）
        const questions = (i === 0) ? currentQuestions : generateQuestions();
        const tempWorksheet = createOffscreenWorksheet(questions, showAnswers, i + 1, copyCount);

        // 等一下讓 DOM 重繪
        await new Promise(resolve => setTimeout(resolve, 100));

        const canvas = await html2canvas(tempWorksheet, {
          scale: 2,
          useCORS: true,
          backgroundColor: '#ffffff',
          width: tempWorksheet.offsetWidth,
          height: tempWorksheet.offsetHeight,
          windowWidth: 1200,
          windowHeight: 1600
        });

        const imgData = canvas.toDataURL('image/png');

        if (i > 0) pdf.addPage();
        pdf.addImage(imgData, 'PNG', 0, 0, 210, 297, undefined, 'FAST');
      }

      // 清空渲染區
      renderZone.innerHTML = '';

      const today = new Date();
      const titleForFilename = (customTitleInput.value.trim() || '時鐘練習單').replace(/[\/\\:*?"<>|]/g, '');
      const filename = titleForFilename + '_' + today.getFullYear() + (today.getMonth() + 1 + '').padStart(2, '0') + (today.getDate() + '').padStart(2, '0') + (copyCount > 1 ? '_' + copyCount + '份' : '') + (showAnswers ? '_含答案' : '') + '.pdf';
      pdf.save(filename);
    } catch (err) {
      alert('PDF 產生失敗：' + err.message);
      console.error(err);
    } finally {
      loading.classList.remove('show');
      loadingText.textContent = '正在產生 PDF...';
    }
  }

  generateBtn.addEventListener('click', regenerate);
  toggleBtn.addEventListener('click', function() {
    showAnswers = !showAnswers;
    renderWorksheet();
  });
  downloadBtn.addEventListener('click', downloadPDF);

  // 標題即時更新預覽
  customTitleInput.addEventListener('input', renderWorksheet);

  window.addEventListener('resize', updateScale);

  regenerate();
})();
</script>

</body>
</html>
